name: "Tests of push & pull"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  FILENAME: README.md

jobs:
  tests:
    name: 'Validate README.md changes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

       # nur ein winziges --target=deps angehängt
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r scripts/requirements.txt
      
      - uses: actions/upload-artifact@v4
        with:
          name: python-deps
          path: venv
                  
  dynamic-detection:
        runs-on: ubuntu-latest
        needs: tests
        steps:
          - uses: actions/checkout@v4   # ← komplettes Repo, kein sparse-checkout
      
          - uses: actions/setup-java@v4
            with: { distribution: 'temurin', java-version: '21' }
      
          - uses: actions/download-artifact@v4
            with:
              name: python-deps
              path: ./deps
      
          - name: Install Syft
            run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      
          - name: Run detector
            run: java -jar dynamicDetector/detectionSystem-1.0-SNAPSHOT-all.jar .
      
          - uses: actions/upload-artifact@v4
            with:
              name: detection-results
              path: |
                dynamic-detection-results.xlsx
                sbom-output.json

